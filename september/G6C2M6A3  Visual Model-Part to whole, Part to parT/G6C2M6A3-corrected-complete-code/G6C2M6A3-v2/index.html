<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtraction Learning App</title>

    <!-- CSS Styles -->
    <link rel="stylesheet" href="css/Outlet.css">
    <link rel="stylesheet" href="css/ReusableButton.css">
    <link rel="stylesheet" href="css/chart.css">
    <link rel="stylesheet" href="css/errormessage.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/option.css">
    <link rel="stylesheet" href="css/startpage.css">






    <!-- React and ReactDOM -->
    <script src="js/react.development.js"></script>
    <script src="js/react-dom.development.js"></script>

    <!-- Babel removed - using React.createElement instead of JSX -->

    <!-- Language Configuration -->
    <script>
        // Set the default language here
        // Available languages: 'en' (English), 'id' (Indonesian)
        window.APP_LANGUAGE = 'id'; // Change this to 'id' for Indonesian
    </script>
</head>

<body>
    <div id="root"></div>

    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/Outlet.js"></script>
    <script src="js/ReusableButton.js"></script>
    <script src="js/ActivityCompleted.js"></script>
    <script src="js/ErrorMessage.js"></script>
    <script src="js/Main.js"></script>
    <script src="js/Option.js"></script>
    <script src="js/PieChart.js"></script>
    <script src="js/PlayAudio.js"></script>
    <script src="js/StartPage.js"></script>









    <script>
        // Ensure i18n is initialized before rendering React components
        document.addEventListener('DOMContentLoaded', function () {
            // Wait for i18n to be available and initialized
            function renderApp() {
                if (typeof i18n !== 'undefined' && i18n.getCurrentLanguage()) {
                    ReactDOM.render(
                        React.createElement(Outlet, null),
                        document.getElementById("root")
                    );
                } else {
                    // Retry in a short time if i18n is not ready
                    setTimeout(renderApp, 50);
                }
            }

            // Start the rendering process
            renderApp();
        });
    </script>

</body>

</html>
