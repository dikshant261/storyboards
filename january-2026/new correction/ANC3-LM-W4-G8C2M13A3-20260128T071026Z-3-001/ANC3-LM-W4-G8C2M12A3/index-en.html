                    document.title = i18n.t('appInfo.title');
                }
            }, 1000);

    <div id="react-root"></div>

    <script src="js/react.development.js"></script>

    <!-- Load data.js and constants.js first for i18n and configuration -->
    <script src="js/data.js"></script>
    <script src="js/constants.js"></script>
    
    <!-- APP CONFIGURATION - Must be before PageConfig.js -->
    <script>
        // ====================================
        // APP CONFIGURATION
        // ====================================
        // 
        // QUICK LANGUAGE SETUP:
        // To force English: Set FORCE_LANGUAGE to 'en'
        // To force Indonesian: Set FORCE_LANGUAGE to 'id'
        // To use auto-detection: Set FORCE_LANGUAGE to null
        // 
        const APP_CONFIG = {
            // UI Elements visibility
            // Set to 'false' to hide question dropdown and page progress indicator
            SHOW_QUESTION_DROPDOWN: false,
            SHOW_PAGE_PROGRESS: true,
            
            // Grid System
            // Set to 'true' to show grid overlay by default on page load
            // Set to 'false' to hide grid overlay by default (can still be toggled with Ctrl+G)
            SHOW_GRID_DEFAULT: true,
            
            // Language Settings
            // Set FORCE_LANGUAGE to 'en' or 'id' to force a specific language
            // Set to null to use auto-detection (browser language + saved preference)
            FORCE_LANGUAGE: 'en', // Options: 'en', 'id', or null
            
            // Supported languages (only English and Indonesian)
            SUPPORTED_LANGUAGES: ['en', 'id'],
            
            // Default language if no preference is found
            DEFAULT_LANGUAGE: 'en',
            
            // Starting Page
            // Set to a specific page number (1, 2, 3, etc.) to start the app on that page
            // Set to null or 1 to start from the first page
            START_PAGE: 1 // Options: 1, 2, 3, etc., or null for default (page 1)
        };
        
        // Set language immediately BEFORE PageConfig.js loads
        (function() {
            let langToUse;
            
            // Check if language is forced in configuration
            if (APP_CONFIG.FORCE_LANGUAGE && APP_CONFIG.SUPPORTED_LANGUAGES.includes(APP_CONFIG.FORCE_LANGUAGE)) {
                langToUse = APP_CONFIG.FORCE_LANGUAGE;
                console.log(`🌐 Language forced to: ${langToUse}`);
            } else {
                // Auto-detect language from browser or use saved preference
                const browserLang = navigator.language.startsWith('id') ? 'id' : 'en';
                const savedLang = localStorage.getItem('appLanguage') || browserLang || APP_CONFIG.DEFAULT_LANGUAGE;
                
                // Ensure it's a supported language
                langToUse = APP_CONFIG.SUPPORTED_LANGUAGES.includes(savedLang) ? savedLang : APP_CONFIG.DEFAULT_LANGUAGE;
                console.log(`🌐 Language auto-detected: ${langToUse}`);
            }
            
            // Set the language in the i18n system immediately
            if (typeof i18n !== 'undefined' && typeof i18n.setLanguage === 'function') {
                i18n.setLanguage(langToUse);
            } else {
                // If i18n not loaded yet, set it directly
                if (typeof AppData !== 'undefined') {
                    AppData.currentLanguage = langToUse;
                    console.log(`🌐 Language set directly to: ${langToUse}`);
                }
            }
        })();
        
        // Make APP_CONFIG globally available
        window.APP_CONFIG = APP_CONFIG;
    </script>
    
    <!-- Core dependencies (load order is important) -->
    <script src="js/GridPrecisionConfig.js"></script>
    <script src="js/GridCellFontUtils.js"></script>

    <!-- Other utilities -->

    
    <!-- Main app -->
    <script src="js/math-applet.js"></script>
    
    <script>
        // Additional initialization on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize i18n system with APP_CONFIG available
            if (typeof i18n !== 'undefined' && typeof i18n.initLanguage === 'function') {
                i18n.initLanguage();
            }
            
            // Save language preference
            window.addEventListener('beforeunload', function() {
                if (typeof i18n !== 'undefined' && typeof i18n.getCurrentLanguage === 'function') {
                    localStorage.setItem('appLanguage', i18n.getCurrentLanguage());
                }
            });
            
            // Initialize App (Simplified)
            setTimeout(() => {
                console.log('Math Learning Applet initialized!');
                console.log('Supported languages:', APP_CONFIG.SUPPORTED_LANGUAGES.join(', '));
                console.log('Use setAppLanguage("en") or setAppLanguage("id") to change language');
            }, 1000);
        });
        
        // Utility function to change language programmatically (for debugging)
        window.setAppLanguage = function(langCode) {
            if (APP_CONFIG.SUPPORTED_LANGUAGES.includes(langCode)) {
                if (typeof i18n !== 'undefined' && i18n.setLanguage(langCode)) {
                    console.log(`🌐 Manual language change to: ${langCode}`);
                    location.reload();
                    return true;
                }
            }
            console.warn(`Language '${langCode}' not supported. Supported languages:`, APP_CONFIG.SUPPORTED_LANGUAGES);
            return false;
        };

        // Initially hide equation 3 elements (except summary text which shows later)
        function hideEquation3() {
            const eq3Elements = [
                'page4-equation3-background',
                'page4-equation3-triplet-text',
                'page4-eq3-flip-card-1',
                'page4-eq3-comma-1',
                'page4-eq3-flip-card-2',
                'page4-eq3-comma-2',
                'page4-eq3-flip-card-3',
                'page4-eq3-summary-text'
            ];
            
            eq3Elements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.style.display = 'none';
                    // Also set visibility to ensure it's hidden
                    element.style.visibility = 'hidden';
                }
            });
        }

        // Show equation 3 when all equation 2 flip cards are flipped
        function checkAndShowEquation3() {
            const card1 = document.getElementById('page4-flip-card-1');
            const card2 = document.getElementById('page4-flip-card-2');
            const card3 = document.getElementById('page4-flip-card-3');
            
            if (!card1 || !card2 || !card3) {
                return;
            }
            
            const card1Flipped = card1.getAttribute('data-flipped') === 'true';
            const card2Flipped = card2.getAttribute('data-flipped') === 'true';
            const card3Flipped = card3.getAttribute('data-flipped') === 'true';
            
            if (card1Flipped && card2Flipped && card3Flipped) {
                // Show equation 3 elements (but not summary text yet)
                const eq3Elements = [
                    'page4-equation3-background',
                    'page4-equation3-triplet-text',
                    'page4-eq3-flip-card-1',
                    'page4-eq3-comma-1',
                    'page4-eq3-flip-card-2',
                    'page4-eq3-comma-2',
                    'page4-eq3-flip-card-3'
                ];
                
                eq3Elements.forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {
                        // For TeacherNoteComponent, use 'flex', for FlipTileComponent, use 'block'
                        const isFlipCard = id.includes('flip-card');
                        element.style.display = isFlipCard ? 'block' : 'flex';
                        element.style.visibility = 'visible';
                    }
                });
            }
        }

        // Show summary text when all equation 3 cards are flipped
        function checkAndShowEq3Summary() {
            const eq3Card1 = document.getElementById('page4-eq3-flip-card-1');
            const eq3Card2 = document.getElementById('page4-eq3-flip-card-2');
            const eq3Card3 = document.getElementById('page4-eq3-flip-card-3');
            
            if (!eq3Card1 || !eq3Card2 || !eq3Card3) {
                return;
            }
            
            const eq3Card1Flipped = eq3Card1.getAttribute('data-flipped') === 'true';
            const eq3Card2Flipped = eq3Card2.getAttribute('data-flipped') === 'true';
            const eq3Card3Flipped = eq3Card3.getAttribute('data-flipped') === 'true';
            
            if (eq3Card1Flipped && eq3Card2Flipped && eq3Card3Flipped) {
                // Show summary text
                const summaryElement = document.getElementById('page4-eq3-summary-text');
                if (summaryElement) {
                    summaryElement.style.display = 'flex';
                }
            }
        }

        // Listen for flip events on equation 2 cards
        function setupEquation3Listener() {
            // Initially hide equation 3 (run multiple times to catch late-rendered elements)
            hideEquation3();
            setTimeout(hideEquation3, 100);
            setTimeout(hideEquation3, 300);
            setTimeout(hideEquation3, 500);
            
            // Check periodically for flip state changes
            let eq3Shown = false;
            const intervalId = setInterval(() => {
                // Also hide on each check to catch any elements that appear late
                if (!eq3Shown) {
                    hideEquation3();
                }
                checkAndShowEquation3();
                
                // Once equation 3 is shown, start checking for eq3 card flips
                const eq3Bg = document.getElementById('page4-equation3-background');
                if (eq3Bg && eq3Bg.style.display !== 'none' && !eq3Shown) {
                    eq3Shown = true;
                    // Start checking for equation 3 card flips
                    const eq3IntervalId = setInterval(() => {
                        checkAndShowEq3Summary();
                        // Stop checking once summary is shown
                        const summary = document.getElementById('page4-eq3-summary-text');
                        if (summary && summary.style.display !== 'none') {
                            clearInterval(eq3IntervalId);
                        }
                    }, 300);
                    
                    // Also listen for clicks on equation 3 cards
                    ['page4-eq3-flip-card-1', 'page4-eq3-flip-card-2', 'page4-eq3-flip-card-3'].forEach(cardId => {
                        document.addEventListener('click', function(e) {
                            const clickedCard = e.target.closest(`#${cardId}`);
                            if (clickedCard) {
                                setTimeout(checkAndShowEq3Summary, 200);
                            }
                        }, true);
                    });
                }
                
                // Stop checking for eq2 flips once eq3 is shown
                if (eq3Shown) {
                    clearInterval(intervalId);
                }
            }, 300);
            
            // Also listen for click events on the equation 2 flip cards
            ['page4-flip-card-1', 'page4-flip-card-2', 'page4-flip-card-3'].forEach(cardId => {
                // Use event delegation since cards might not be ready yet
                document.addEventListener('click', function(e) {
                    const clickedCard = e.target.closest(`#${cardId}`);
                    if (clickedCard) {
                        setTimeout(checkAndShowEquation3, 200);
                    }
                }, true);
            });
        }

        // Wait for DOM and React to be ready
        function initEquation3Visibility() {
            // Hide initially
            setTimeout(hideEquation3, 100);
            
            // Setup listener
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupEquation3Listener);
            } else {
                setTimeout(setupEquation3Listener, 500);
            }
        }
        
        // Listen for page changes to hide equation 3 when navigating to page 4
        function handlePageChange(event) {
            const pageNumber = event.detail?.page || event.detail?.pageNumber;
            if (pageNumber === 4) {
                console.log('📄 [Page 4] Page changed to 4, hiding equation 3 elements');
                // Hide equation 3 elements immediately
                hideEquation3();
                // Setup listener after a short delay to ensure React has rendered
                setTimeout(setupEquation3Listener, 300);
            }
        }
        
        // Listen for quizCompleted event to show summary text on page 4
        function handleQuizCompleted(event) {
            const pageNumber = event.detail?.pageNumber;
            if (pageNumber === 4) {
                console.log('📄 [Page 4] Quiz completed, showing summary text');
                const summaryElement = document.getElementById('page4-eq3-summary-text');
                if (summaryElement) {
                    summaryElement.style.display = 'flex';
                    summaryElement.style.visibility = 'visible';
                }
            }
        }
        
        // Listen for page change events
        if (typeof window !== 'undefined') {
            window.addEventListener('pageChanged', handlePageChange);
            window.addEventListener('quizCompleted', handleQuizCompleted);
        }
        
        // Also initialize on page load (in case we start on page 4)
        initEquation3Visibility();
    </script>
