        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                if (typeof i18n !== 'undefined') {
                    document.title = i18n.t('appInfo.title');
                }
            }, 1000);
        });
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">

<body>
    <div id="react-root"></div>
    
    <!-- Language selector removed - language detection is automatic or can be set programmatically -->
    
    <!-- Animation library (offline) -->
    <script src="js/anime.min.js"></script>
    
    <!-- React development files (offline version) -->
    <script src="js/react.development.js"></script>
    <script src="js/react-dom.development.js"></script>

    <!-- Load data.js and constants.js first for i18n and configuration -->
    <script src="js/data.js"></script>
    <script src="js/constants.js"></script>
    
    <!-- APP CONFIGURATION - Must be before PageConfig.js -->
    <script>
        // ====================================
        // APP CONFIGURATION
        // ====================================
        // 
        // QUICK LANGUAGE SETUP:
        // To force English: Set FORCE_LANGUAGE to 'en'
        // To force Indonesian: Set FORCE_LANGUAGE to 'id'
        // To use auto-detection: Set FORCE_LANGUAGE to null
        // 
        const APP_CONFIG = {
            // UI Elements visibility
            // Set to 'false' to hide question dropdown and page progress indicator
            SHOW_QUESTION_DROPDOWN: false,
            SHOW_PAGE_PROGRESS: true,
            
            // Grid System
            // Set to 'true' to show grid overlay by default on page load
            // Set to 'false' to hide grid overlay by default (can still be toggled with Ctrl+G)
            SHOW_GRID_DEFAULT: true,
            
            // Language Settings
            // Set FORCE_LANGUAGE to 'en' or 'id' to force a specific language
            // Set to null to use auto-detection (browser language + saved preference)
            FORCE_LANGUAGE: 'id', // Options: 'en', 'id', or null
            
            // Supported languages (only English and Indonesian)
            SUPPORTED_LANGUAGES: ['en', 'id'],
            
            // Default language if no preference is found
            DEFAULT_LANGUAGE: 'id',
            
            // Starting Page
            // Set to a specific page number (1, 2, 3, etc.) to start the app on that page
            // Set to null or 1 to start from the first page
            START_PAGE: 1 // Options: 1, 2, 3, etc., or null for default (page 1)
        };
        
        // Set language immediately BEFORE PageConfig.js loads
        (function() {
            let langToUse;
            
            // Check if language is forced in configuration
            if (APP_CONFIG.FORCE_LANGUAGE && APP_CONFIG.SUPPORTED_LANGUAGES.includes(APP_CONFIG.FORCE_LANGUAGE)) {
                langToUse = APP_CONFIG.FORCE_LANGUAGE;
                console.log(`🌐 Language forced to: ${langToUse}`);
            } else {
                // Auto-detect language from browser or use saved preference
                const browserLang = navigator.language.startsWith('id') ? 'id' : 'en';
                const savedLang = localStorage.getItem('appLanguage') || browserLang || APP_CONFIG.DEFAULT_LANGUAGE;
                
                // Ensure it's a supported language
                langToUse = APP_CONFIG.SUPPORTED_LANGUAGES.includes(savedLang) ? savedLang : APP_CONFIG.DEFAULT_LANGUAGE;
                console.log(`🌐 Language auto-detected: ${langToUse}`);
            }
            
            // Set the language in the i18n system immediately
            if (typeof i18n !== 'undefined' && typeof i18n.setLanguage === 'function') {
                i18n.setLanguage(langToUse);
            } else {
                // If i18n not loaded yet, set it directly
                if (typeof AppData !== 'undefined') {
                    AppData.currentLanguage = langToUse;
                    console.log(`🌐 Language set directly to: ${langToUse}`);
                }
            }
        })();
        
        // Make APP_CONFIG globally available
        window.APP_CONFIG = APP_CONFIG;
    </script>
    
    <!-- Core dependencies (load order is important) -->
    <script src="js/GridPrecisionConfig.js"></script>
    <script src="js/GridCellFontUtils.js"></script>

    <script src="js/quadrilateral-config.js"></script>

    <!-- Other utilities -->

    
    <!-- Main app -->
    <script src="js/math-applet.js"></script>
    
    <script>
        // Additional initialization on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize i18n system with APP_CONFIG available
            if (typeof i18n !== 'undefined' && typeof i18n.initLanguage === 'function') {
                i18n.initLanguage();
            }
            
            // Save language preference
            window.addEventListener('beforeunload', function() {
                if (typeof i18n !== 'undefined' && typeof i18n.getCurrentLanguage === 'function') {
                    localStorage.setItem('appLanguage', i18n.getCurrentLanguage());
                }
            });
            
            // Initialize App (Simplified)
            setTimeout(() => {
                console.log('Math Learning Applet initialized!');
                console.log('Supported languages:', APP_CONFIG.SUPPORTED_LANGUAGES.join(', '));
                console.log('Use setAppLanguage("en") or setAppLanguage("id") to change language');
            }, 1000);
        });
        
        // Utility function to change language programmatically (for debugging)
        window.setAppLanguage = function(langCode) {
            if (APP_CONFIG.SUPPORTED_LANGUAGES.includes(langCode)) {
                if (typeof i18n !== 'undefined' && i18n.setLanguage(langCode)) {
                    console.log(`🌐 Manual language change to: ${langCode}`);
                    location.reload();
                    return true;
                }
            }
            console.warn(`Language '${langCode}' not supported. Supported languages:`, APP_CONFIG.SUPPORTED_LANGUAGES);
            return false;
        };
        
        // Helper function to find and use confirmRightAngle animation
        window.findConfirmRightAngle = function(quadIdOrName) {
            console.log('🔍 Searching for confirmRightAngle animation...');
            
            // Method 1: Check registry
            if (window.quadrilateralAnimations) {
                console.log('📋 Available quadrilaterals in registry:', Object.keys(window.quadrilateralAnimations));
                
                if (window.quadrilateralAnimations[quadIdOrName]) {
                    const anim = window.quadrilateralAnimations[quadIdOrName].animateConfirmRightAngle;
                    if (anim) {
                        console.log(`✅ Found in registry: window.quadrilateralAnimations['${quadIdOrName}'].animateConfirmRightAngle`);
                        return anim;
                    }
                }
            }
            
            // Method 2: Check direct element
            const element = document.getElementById(quadIdOrName) || 
                          document.querySelector(`[data-element-name="${quadIdOrName}"]`);
            if (element && element.animateConfirmRightAngle) {
                console.log(`✅ Found on element: element.animateConfirmRightAngle`);
                return element.animateConfirmRightAngle.bind(element);
            }
            
            // Method 3: Check window function
            const safeName = quadIdOrName.replace(/-/g, '_');
            const windowFuncName = `animateConfirmRightAngle_${safeName}`;
            if (window[windowFuncName]) {
                console.log(`✅ Found as window function: window.${windowFuncName}`);
                return window[windowFuncName];
            }
            
            console.error('❌ Could not find animateConfirmRightAngle for:', quadIdOrName);
            console.log('💡 Try these methods:');
            console.log('   1. window.quadrilateralAnimations["' + quadIdOrName + '"].animateConfirmRightAngle(0, 0)');
            console.log('   2. document.getElementById("' + quadIdOrName + '").animateConfirmRightAngle(0, 0)');
            console.log('   3. window.animateConfirmRightAngle_' + safeName + '(0, 0)');
            return null;
        };
        
        // Convenience function to call confirmRightAngle
        // vertex: vertex name (e.g., 'A', 'B', 'C', 'D') or index (0-3)
        // mode: 'auto' (all phases run automatically) or 'manual' (step-by-step, click/keypress to advance)
        //   Also accepts numeric: 1='auto', 2='manual' (backward compatible)
        // Note: side and armTargetVertex are automatically determined from the vertex:
        //   - side: The side that ends at the given vertex (e.g., for vertex C, uses side BC)
        //   - armTargetVertex: The adjacent vertex that is NOT on the selected side
        window.confirmRightAngle = function(quadIdOrName, vertex, mode) {
            const anim = window.findConfirmRightAngle(quadIdOrName);
            if (anim) {
                // Pass only vertex and mode (side and armTargetVertex are auto-determined)
                anim(vertex, mode || 'auto');
                return true;
            }
            return false;
        };
        
        // Convenience function to call confirmAllAnglesRight
        // This will animate through all 4 vertices (A, B, C, D) sequentially
        // mode: 'auto' (all phases run automatically) or 'manual' (step-by-step)
        // delayBetween: Delay in milliseconds between each vertex animation (default: 500)
        window.confirmAllAnglesRight = function(quadIdOrName, mode, delayBetween) {
            // Try to find the method in the registry
            if (window.quadrilateralAnimations && window.quadrilateralAnimations[quadIdOrName]) {
                const method = window.quadrilateralAnimations[quadIdOrName].confirmAllAnglesRight;
                if (method) {
                    method(mode || 'auto', delayBetween || 500);
                    return true;
                }
            }
            
            // Try to find on element
            const element = document.getElementById(quadIdOrName) || 
                          document.querySelector(`[data-element-name="${quadIdOrName}"]`);
            if (element && element.confirmAllAnglesRight) {
                element.confirmAllAnglesRight(mode || 'auto', delayBetween || 500);
                return true;
            }
            
            // Try window function
            const safeName = quadIdOrName.replace(/-/g, '_');
            const windowFuncName = `confirmAllAnglesRight_${safeName}`;
            if (window[windowFuncName]) {
                window[windowFuncName](mode || 'auto', delayBetween || 500);
                return true;
            }
            
            console.error('❌ Could not find confirmAllAnglesRight for:', quadIdOrName);
            return false;
        };
    </script>
</body>
